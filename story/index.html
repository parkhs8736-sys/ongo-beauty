<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="온고뷰티가 제품을 만들며 발견한 생각과 머릿결 관리 이야기를 기록합니다.">
  <title>이야기 | 온고뷰티</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../script.js" defer></script>
</head>
<body class="blog-page">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="온고뷰티 홈"><span class="brand-mark" aria-hidden="true">온</span><span>온고뷰티</span></a>
    <nav class="desktop-nav" aria-label="주요 메뉴">
      <a href="../about.html">내 소개</a><a href="../products.html">제품</a><a href="./" aria-current="page">이야기</a><a href="../contact.html">연락하기</a>
    </nav>
    <a class="header-cta" href="../products.html">제품 보기</a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="mobile-menu"><span></span><span></span><span class="sr-only">메뉴 열기</span></button>
  </header>
  <nav class="mobile-menu" id="mobile-menu" aria-label="모바일 메뉴" hidden>
    <a href="../index.html">홈</a><a href="../about.html">내 소개</a><a href="../products.html">제품</a><a href="./" aria-current="page">이야기</a><a href="../contact.html">연락하기</a>
  </nav>

  <main id="main">
    <section class="blog-hero section-shell" aria-labelledby="blog-title" data-reveal>
      <div>
        <p class="eyebrow">ONGO JOURNAL</p>
        <h1 id="blog-title">제품 뒤의 생각을<br><em>천천히 기록합니다.</em></h1>
      </div>
      <div class="blog-hero-note">
        <p>만드는 과정의 고민부터 매일의 머릿결을 돌보는 방법까지, 오래 남기고 싶은 이야기를 전합니다.</p>
        <a class="text-link" href="admin.html">글 관리 <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="blog-list-section section-shell" aria-labelledby="latest-stories-title">
      <header class="blog-list-heading">
        <p class="section-label">LATEST STORIES</p>
        <h2 id="latest-stories-title">최근 이야기</h2>
      </header>
      <ul class="blog-list" id="list" aria-live="polite">
        <li class="blog-state">이야기를 불러오는 중입니다.</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand"><span class="brand-mark" aria-hidden="true">온</span><strong>온고뷰티</strong></div><p>매일 닿는 온도까지, 머릿결을 생각합니다.</p>
    <div class="footer-links"><a href="../about.html">내 소개</a><a href="../products.html">제품</a><a href="./">이야기</a><a href="../contact.html">연락하기</a></div>
    <small>© <span data-year>2026</span> ONGO BEAUTY. All rights reserved.</small>
  </footer>

  <script>
  (function(){
    var list = document.getElementById('list');

    function el(tag, cls, text){
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    function fmtDate(value){
      var date = new Date(value + 'T00:00:00');
      if (isNaN(date)) return value || '';
      return date.getFullYear() + '. ' + String(date.getMonth() + 1).padStart(2, '0') + '. ' + String(date.getDate()).padStart(2, '0');
    }

    function render(posts){
      if (!Array.isArray(posts) || posts.length === 0){
        list.replaceChildren(el('li', 'blog-state', '첫 번째 이야기를 준비하고 있습니다.'));
        return;
      }

      posts = posts.slice().sort(function(a, b){
        return String(b.date || '').localeCompare(String(a.date || ''));
      });

      var cards = posts.map(function(post, index){
        var item = el('li', 'blog-card');
        var link = el('a');
        link.href = post.url ? String(post.url) : 'post.html?id=' + encodeURIComponent(post.id || '');

        var meta = el('div', 'blog-card-meta');
        var time = el('time', null, fmtDate(post.date));
        time.setAttribute('datetime', String(post.date || ''));
        meta.append(time, el('span', null, String(index + 1).padStart(2, '0')));

        link.append(meta, el('h3', null, String(post.title || '(제목 없음)')));
        if (post.summary) link.append(el('p', 'blog-summary', String(post.summary)));

        if (Array.isArray(post.tags) && post.tags.length){
          var tags = el('div', 'blog-tags');
          post.tags.forEach(function(tag){ tags.append(el('span', 'blog-tag', String(tag))); });
          link.append(tags);
        }

        item.append(link);
        return item;
      });

      list.replaceChildren.apply(list, cards);
    }

    fetch('posts.json', {cache: 'no-store'})
      .then(function(response){ if (!response.ok) throw new Error(response.status); return response.json(); })
      .then(render)
      .catch(function(){ list.replaceChildren(el('li', 'blog-state', '이야기를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.')); });
  })();
  </script>
</body>
</html>
