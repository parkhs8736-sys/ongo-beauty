  <div class="post-wrap">

  <script>
  (function(){
    var main = document.getElementById('main');

    function el(tag, cls, text){
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    function fmtDate(value){
      var date = new Date(value + 'T00:00:00');
      if (isNaN(date)) return value || '';
      return date.getFullYear() + '. ' + String(date.getMonth() + 1).padStart(2, '0') + '. ' + String(date.getDate()).padStart(2, '0');
    }

    function renderBody(source){
      var box = el('div', 'post-body');
      String(source || '').replace(/\r\n/g, '\n').split(/\n\s*\n/).forEach(function(block){
        block = block.trim();
        if (!block) return;
        var lines = block.split('\n');
        if (lines.every(function(line){ return /^- /.test(line.trim()); })){
          var list = el('ul');
          lines.forEach(function(line){ list.append(el('li', null, line.trim().slice(2))); });
          box.append(list);
        } else if (/^## /.test(block)) {
          box.append(el('h2', null, block.slice(3).trim()));
        } else {
          box.append(el('p', null, block));
        }
      });
      return box;
    }

    function notFound(){
      var box = el('div', 'post-notfound');
      box.append(el('h1', null, '글을 찾을 수 없습니다'));
      box.append(el('p', null, '주소가 잘못되었거나 삭제된 글일 수 있습니다.'));
      var link = el('a', 'button button-primary', '이야기 목록으로');
      link.href = './';
      box.append(link);
      main.replaceChildren(box);
    }

    function hrefOf(post){
      return post.url ? String(post.url) : 'post.html?id=' + encodeURIComponent(post.id || '');
    }

    function setAttr(selector, attribute, value){
      var node = document.querySelector(selector);
      if (node) node.setAttribute(attribute, value);
    }

    function addLd(data){
      var script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(data);
      document.head.append(script);
    }

    function setMeta(post){
      var title = String(post.title || '이야기');
      var description = String(post.description || post.summary || '').slice(0, 160);
      var siteBase = 'https://parkhs8736-sys.github.io/ongo-beauty';
      var url = post.url
        ? new URL(String(post.url), siteBase + '/story/').href
        : siteBase + '/story/post.html?id=' + encodeURIComponent(post.id || '');
      var author = String(post.author || '').trim();
      document.title = title + ' | 온고뷰티';
      setAttr('meta[name="description"]', 'content', description);
      setAttr('meta[name="author"]', 'content', author);
      setAttr('link[rel="canonical"]', 'href', url);
      setAttr('meta[property="og:title"]', 'content', title);
      setAttr('meta[property="og:description"]', 'content', description);
      setAttr('meta[property="og:url"]', 'content', url);

      var article = {
        '@context': 'https://schema.org', '@type': 'BlogPosting', headline: title,
        description: description, datePublished: String(post.date || ''),
        dateModified: String(post.updated || post.date || ''), mainEntityOfPage: url,
        keywords: Array.isArray(post.tags) ? post.tags.map(String).join(', ') : '',
        image: siteBase + '/assets/og-modern.png', inLanguage: 'ko-KR',
        publisher: {'@id': siteBase + '/#organization'}
      };
      if (author) article.author = {'@type': 'Person', name: author};
      addLd(article);

      var faq = Array.isArray(post.faq) ? post.faq.filter(function(item){ return item && item.q && item.a; }) : [];
      if (faq.length){
        addLd({'@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: faq.map(function(item){
          return {'@type': 'Question', name: String(item.q), acceptedAnswer: {'@type': 'Answer', text: String(item.a)}};
        })});
      }
      addLd({'@context': 'https://schema.org', '@type': 'BreadcrumbList', itemListElement: [
        {'@type': 'ListItem', position: 1, name: '홈', item: siteBase + '/index.html'},
        {'@type': 'ListItem', position: 2, name: '이야기', item: siteBase + '/story/'},
        {'@type': 'ListItem', position: 3, name: title, item: url}
      ]});
    }

    function renderFaq(items){
      var section = el('section', 'post-faq');
      section.append(el('h2', null, '자주 묻는 질문'));
      items.forEach(function(item){
        var detail = el('details');
        detail.append(el('summary', null, String(item.q)));
        detail.append(el('p', null, String(item.a)));
        section.append(detail);
      });
      return section;
    }

    function renderSources(items){
      var section = el('section', 'post-sources');
      section.append(el('h2', null, '참고·출처'));
      var list = el('ol');
      items.forEach(function(item){
        var row = el('li');
        if (item && item.url){
          var link = el('a', null, String(item.title || item.url));
          link.href = String(item.url); link.rel = 'noopener'; link.target = '_blank';
          row.append(link);
        } else row.textContent = String(item && item.title || item || '');
        list.append(row);
      });
      section.append(list);
      return section;
    }

    function render(posts){
      var id = new URLSearchParams(location.search).get('id') || new URLSearchParams(location.search).get('slug');
      posts = (Array.isArray(posts) ? posts : []).slice().sort(function(a, b){ return String(b.date || '').localeCompare(String(a.date || '')); });
      var index = posts.findIndex(function(post){ return String(post.id) === id || (post.url && String(post.url).replace(/\.html$/, '') === id); });
      if (index < 0){ notFound(); return; }

      var post = posts[index];
      setMeta(post);
      var article = el('article', 'post-article');
      var head = el('header', 'post-head');
      var time = el('time', null, fmtDate(post.date));
      time.setAttribute('datetime', String(post.date || ''));
      head.append(time, el('h1', null, String(post.title || '(제목 없음)')));

      if (post.author || (post.updated && post.updated !== post.date)){
        var meta = el('div', 'post-meta');
        if (post.author) meta.append(el('span', null, String(post.author)));
        if (post.updated && post.updated !== post.date) meta.append(el('span', null, '수정 ' + fmtDate(post.updated)));
        head.append(meta);
      }

      if (Array.isArray(post.tags) && post.tags.length){
        var tags = el('div', 'blog-tags');
        post.tags.forEach(function(tag){ tags.append(el('span', 'blog-tag', String(tag))); });
        head.append(tags);
      }

      article.append(head, el('hr', 'post-rule'), renderBody(post.body));
      var faq = Array.isArray(post.faq) ? post.faq.filter(function(item){ return item && item.q && item.a; }) : [];
      if (faq.length) article.append(renderFaq(faq));
      if (Array.isArray(post.sources) && post.sources.length) article.append(renderSources(post.sources));

      var previous = posts[index + 1];
      var next = posts[index - 1];
      if (previous || next){
        var nav = el('nav', 'post-pn');
        nav.setAttribute('aria-label', '이전 글과 다음 글');
        function cell(item, className, label){
          if (!item){ nav.append(el('span')); return; }
          var link = el('a', className);
          link.href = hrefOf(item);
          link.append(el('span', 'post-pn-dir', label), el('strong', null, String(item.title || '')));
          nav.append(link);
        }
        cell(previous, 'previous', '이전 글');
        cell(next, 'next', '다음 글');
        article.append(nav);
      }

      main.replaceChildren(article);
    }

    fetch('posts.json', {cache: 'no-store'})
      .then(function(response){ if (!response.ok) throw new Error(response.status); return response.json(); })
      .then(render)
      .catch(notFound);
  })();
  </script>
  <script src="../assets/cart.js" defer></script>
